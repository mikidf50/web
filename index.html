    <script>
      // Ignore HMR WebSocket connection errors as specified in runtime environment constraints
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('WebSocket') || e.message.includes('createWebSocketModuleRunnerTransport') || (e.filename && e.filename.includes('@vite/client')))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var msg = (e.reason && (e.reason.message || e.reason.stack)) || '';
        if (msg.includes('WebSocket') || msg.includes('createWebSocketModuleRunnerTransport') || msg.includes('@vite/client')) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
  </head>

  </body>
