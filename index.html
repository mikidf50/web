<!doctype html>
<html lang="am">
  <head>
    <script>
      (function() {
        // Suppress harmless Vite WebSocket HMR transport notices in iframe preview
        const origError = console.error;
        console.error = function(...args) {
          if (args[0] && typeof args[0] === 'string' && (args[0].includes('failed to connect to websocket') || args[0].includes('[vite]') || args[0].includes('WebSocket'))) {
            return;
          }
          origError.apply(console, args);
        };
        window.addEventListener('unhandledrejection', function(event) {
          if (event.reason && (String(event.reason).includes('WebSocket') || event.reason.stack?.includes('@vite/client'))) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          if (event.message?.includes('WebSocket') || event.filename?.includes('@vite/client') || event.error?.stack?.includes('@vite/client')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  </head>
